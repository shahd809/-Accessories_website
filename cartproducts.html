<!DOCTYPE html>
<html>
    <head>
        <title>Cart Products</title>
        <link rel="stylesheet" href="boot/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/all.css">

    </head>
    <body>
        <header>
            <div class="container">
                <div class="header_content">
                    <a href="index.html" class="brand">shopping cart</a>
                    <nav>
                        <ul id="link">
                            <li><a class="btn btn-outline-primary" href="login.html">Sign In</a></li>
                            <li><a class="btn btn-outline-success" href="register.html">Sign Up</a></li>
                        </ul>

                        <ul id="user_info" style="display:none; list-style:none; gap:15px; align-items:center;">

                            <li id="user"></li>
                            <li>
                                <i class="fas fa-shopping-cart" id="cart_icon" style="cursor:pointer;"></i>
                                <span class="badge" id="cart_count">0</span>
                                <div class="cart_products" id="cart_dropdown" style="display:none; position:absolute; background:#fff; border:1px solid #ccc; padding:10px; right:0; top:40px; width:300px;"></div>
                            </li>
                            <li><a href="#" id="logout">Log Out</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>

        

        <section class="sec_form">
            
            <div class="container mt-4">
                <h2>Your Cart</h2>
                <div class="cart_products row g-4" id="cart_container">
                </div>
                <div class="mt-3">
                    <h4 id="total_price">Total Price: $0</h4>
                </div>
            </div>

        </section>







       <script src="js/login.js"></script>
    </body>



</html>
